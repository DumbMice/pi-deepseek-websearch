name: publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  id-token: write # required for npm trusted publishing (OIDC)
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      # Trusted publishing needs npm >= 11.5.1; the runner's bundled npm may be older.
      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - run: npm ci

      - run: npm test

      - run: npm run typecheck

      - name: OIDC diagnostics
        run: |
          echo "node: $(node --version)"
          echo "npm: $(npm --version)"
          echo "repository.url: $(node -p "require('./package.json').repository.url")"
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "id-token endpoint: present"
          else
            echo "id-token endpoint: MISSING (permissions: id-token: write not applied?)"
          fi
          echo "NODE_AUTH_TOKEN set: ${NODE_AUTH_TOKEN:+yes}${NODE_AUTH_TOKEN:-no}"

      # Guard against publishing a tag whose version disagrees with package.json.
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi

      # No NODE_AUTH_TOKEN: npm detects the OIDC environment and exchanges the
      # GitHub token for a short-lived publish credential (provenance included).
      - name: Publish to npm
        run: npm publish
